<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeakerFolio - Speaker Portfolio & Resume</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Counterpart to public/404.html for the GitHub Pages SPA fallback:
      // restore the original path before React Router boots.
      (function () {
        var l = window.location;
        var params = new URLSearchParams(l.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var search = q ? '?' + q : '';
          window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + p + search + l.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
